<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M!LKポスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yomogi&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* 読みやすいように少し濃くした色（2026年11月14日 アイデア1） */
    --bg: #fffaf2; --dot: #ffe3ec; --text: #4a3b3b; --sub: #7a6464;
    --pink: #c7406a; --pink-strong: #d6366a; --mint: #7cc6a4;
    --green: #23794f; --orange: #b85a12; --rose: #c43d66; --blue-bg: #e6f4ff; --blue: #1f6fb2;
    --line: #ffd6e2; --line2: #ffe0ea;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    /* 背景（2026年11月14日 みんさんが決定）：いちばん上に白い小さなレース、
       その下でメンバーカラーのオーロラがふんわり光り、下はクリーム色。
       左から ピンク（佐野）→イエロー（吉田）→ブルー（塩﨑）→ホワイト（山中）→レッド（曽野） */
    /* 2026年11月14日 更新：白いレースのかわりに、上は「I-4 ぽってり」（右によせてとろけるミルク＋5人の色のしずく）、
       下は「C」（ミルクだまり＋5人の色のしずく）。ミルクの形は下の <svg> に、ページの幅に合わせて描く */
    position: relative;
    min-height: 100vh;
    background-color: var(--bg);
    background:
      linear-gradient(180deg, transparent 0, transparent 120px, var(--bg) 300px) top left / 100% 340px no-repeat,
      radial-gradient(circle at 10% 0, rgba(255,179,201,.8), transparent 40%) top left / 100% 340px no-repeat,
      radial-gradient(circle at 30% 0, rgba(255,227,110,.8), transparent 35%) top left / 100% 340px no-repeat,
      radial-gradient(circle at 50% 0, rgba(159,195,255,.8), transparent 35%) top left / 100% 340px no-repeat,
      radial-gradient(circle at 70% 0, rgba(223,230,241,1), transparent 35%) top left / 100% 340px no-repeat,
      radial-gradient(circle at 92% 0, rgba(255,148,148,.8), transparent 40%) top left / 100% 340px no-repeat,
      radial-gradient(circle at 10% 100%, rgba(255,179,201,.6), transparent 40%) bottom left / 100% 260px no-repeat,
      radial-gradient(circle at 30% 100%, rgba(255,227,110,.6), transparent 35%) bottom left / 100% 260px no-repeat,
      radial-gradient(circle at 50% 100%, rgba(159,195,255,.6), transparent 35%) bottom left / 100% 260px no-repeat,
      radial-gradient(circle at 70% 100%, rgba(223,230,241,1), transparent 35%) bottom left / 100% 260px no-repeat,
      radial-gradient(circle at 92% 100%, rgba(255,148,148,.6), transparent 40%) bottom left / 100% 260px no-repeat,
      var(--bg);
    color: var(--text);
    /* 文字は「よもぎ」（2026年11月14日 みんさんが決定）。よもぎは太字がないので、無理に太くしない */
    font-family: "Yomogi", "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    font-synthesis: none;
    font-size: 18px; line-height: 1.6;
    padding: 96px 16px 48px;
  }
  .melt-top, .melt-bottom { position: absolute; left: 0; width: 100%; pointer-events: none; z-index: 0; overflow: visible; }
  .melt-top { top: 0; height: 124px; filter: drop-shadow(0 2px 3px rgba(226,87,127,.2)); }
  .melt-bottom { bottom: 0; height: 120px; filter: drop-shadow(0 -2px 3px rgba(226,87,127,.2)); }
  .wrap { position: relative; z-index: 1; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 26px; font-weight: 800; color: var(--pink); }
  /* タイトルは5人の色のふちの名札（2026年11月14日 見本C） */
  h1 { display: table; margin: 0 auto 6px; padding: 6px 22px; border-radius: 999px; border: 4px solid transparent;
       background: linear-gradient(#fff, #fff) padding-box, linear-gradient(90deg, #ffb3c9, #ffe36e, #9fc3ff, #dfe6f1, #ff9494) border-box;
       box-shadow: 0 3px 10px rgba(226,87,127,.18); position: relative; z-index: 2; }
  .last { font-size: 16px; color: var(--sub); margin-top: 2px; text-align: center; }
  .err { margin-top: 8px; font-size: 16px; color: #fff; background: var(--pink); padding: 8px 12px; border-radius: 12px; }
  .info { margin-top: 8px; font-size: 15px; color: var(--sub); }
  button { font-family: inherit; cursor: pointer; }
  .btn-check {
    display: block; width: 100%; margin: 16px 0 22px;
    /* 案2「こげ茶の文字＋うすいミルク色」（2026年11月14日 みんさんが決定） */
    font-size: 22px; font-weight: 800; letter-spacing: .06em; padding: 14px;
    border: 2px solid #fff;
    background: linear-gradient(135deg, #ffc2d4, #ffd8a8); color: #3d2e2e;
    border-radius: 999px; box-shadow: 0 4px 0 #e2577f;
  }
  /* 見本F（2026年11月15日）：うすい5人の色＋こい5人の色のふち＋説明の文 */
  .btn-check { border: 4px solid transparent; border-radius: 28px; padding: 10px 14px;
               background: linear-gradient(90deg, #ffe3ec, #fff6cc, #e3eeff, #f1f4f9, #ffe0e0) padding-box,
                           linear-gradient(90deg, #ffb3c9, #ffe36e, #9fc3ff, #dfe6f1, #ff9494) border-box;
               box-shadow: 0 4px 12px rgba(226,87,127,.22); }
  /* ふちの上のまん中に「クリック」の名札（2026年11月15日） */
  .btn-check { position: relative; margin-top: 30px; }
  .btn-check::before { content: "クリック"; position: absolute; top: -17px; left: 50%; transform: translateX(-50%); white-space: nowrap;
                       background: #fff; border: 3px solid #ffc2d4; border-radius: 999px; padding: 0 16px; font-size: 14px; font-weight: 700;
                       letter-spacing: .08em; color: var(--pink); line-height: 26px; }
  .btn-check .sub { display: block; font-size: 13px; font-weight: 400; letter-spacing: 0; color: #7a6262; margin-top: 2px; }
  .btn-check:active { transform: translateY(3px); box-shadow: 0 1px 4px rgba(226,87,127,.22); }
  .btn-check:disabled { opacity: .7; cursor: wait; }
  h2 { font-size: 19px; font-weight: 800; color: var(--pink); margin: 4px 0 10px; }
  .item {
    display: block; padding: 12px 14px; margin-bottom: 10px; text-decoration: none; color: inherit;
    background: #fff; border: 2px solid var(--line); border-radius: 18px;
  }
  .item:hover { border-color: #ffb3c8; }
  .meta { font-size: 15px; color: var(--sub); display: flex; gap: 8px; align-items: center; }
  .tag { font-size: 14px; font-weight: 700; padding: 1px 9px; border-radius: 999px; background: var(--blue-bg); color: var(--blue); }
  .tag.live { background: var(--pink-strong); color: #fff; }
  .tag.short { background: #fff0d9; color: #b85a12; }
  .ttl { font-size: 17px; margin-top: 4px;
         display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
  .empty { font-size: 16px; color: var(--sub); padding: 10px 4px; }
  .more { display: block; width: 100%; font-size: 16px; padding: 10px; margin-bottom: 10px;
          background: #fff; border: 2px solid var(--line2); border-radius: 999px; color: var(--sub); }
  form { padding: 14px; margin: 6px 0 14px; background: #fff; border: 2px dashed #ffb3c8; border-radius: 18px; }
  label { display: block; font-size: 15px; color: var(--sub); margin-bottom: 4px; }
  input {
    width: 100%; font-family: inherit; font-size: 17px; padding: 10px 12px; margin-bottom: 10px;
    background: var(--bg); border: 2px solid var(--line2); border-radius: 12px; color: var(--text);
  }
  input:focus { outline: none; border-color: #ffb3c8; }
  .btn-add { width: 100%; font-size: 18px; font-weight: 800; padding: 11px; border: none; background: var(--mint); color: #4a3b3b; border-radius: 999px; }
  .form-msg { font-size: 15px; color: var(--pink); min-height: 1.4em; margin-top: 6px; }
  .dl { display: flex; align-items: center; gap: 10px; padding: 12px 14px; margin-bottom: 10px; background: #fff; border: 2px solid var(--line2); border-radius: 18px; }
  .dl .name { flex: 1; font-size: 17px; min-width: 0; word-break: break-all; }
  .dl .name a { color: inherit; }
  .dl .date { font-size: 14px; color: var(--sub); display: block; }
  .left { font-size: 17px; font-weight: 800; white-space: nowrap; color: var(--green); }
  .left.soon { color: var(--rose); }
  .left.over { color: var(--sub); }

  /* ===== 2026年11月14日 デザインのアイデアを入れたところ ===== */
  /* アイデア3：いちばん上の「つぎの締め切り」の帯 */
  .next { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 8px 14px; width: 100%;
          background: #fff; border: 2px solid var(--line); border-radius: 999px; font-family: inherit;
          font-size: 16px; color: var(--text); text-align: left; cursor: pointer; min-height: 48px; }
  .next .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .next b { color: var(--rose); white-space: nowrap; font-weight: 800; }
  /* アイデア4：新着を日にちで区切る */
  .day { font-size: 15px; font-weight: 800; color: var(--sub); margin: 12px 4px 6px; display: flex; align-items: center; gap: 8px; }
  .day::after { content: ""; flex: 1; height: 2px; background: var(--line); border-radius: 2px; }
  /* アイデア5：まだ見ていない最新に小さな点 ／ アイデア7：配信のカードに太い線 */
  .item { position: relative; }
  .item.live { border-left: 8px solid var(--pink-strong); }
  .dot { position: absolute; top: 12px; right: 12px; width: 10px; height: 10px; border-radius: 50%; background: var(--pink-strong); }
  /* アイデア2：大きな数字のカウントダウン */
  .count { width: 68px; height: 68px; flex: none; border-radius: 50%; display: flex; flex-direction: column;
           align-items: center; justify-content: center; line-height: 1.1; color: #fff; background: var(--green); }
  .count small { font-size: 12px; font-weight: 700; }
  .count strong { font-size: 26px; font-weight: 800; }
  .count.week { background: var(--orange); }
  .count.soon { background: var(--rose); }
  .count.over { background: #b9a8a8; }
  .count.today strong { font-size: 18px; }
  .dl.over { opacity: .7; }
  /* インスタを見るボタン */
  .btn-sns { display: flex; align-items: center; justify-content: center; min-height: 48px; margin: -8px 0 22px;
             padding: 8px 16px; background: #fff; border: 2px solid var(--line); border-radius: 999px;
             color: var(--pink); font-size: 17px; text-decoration: none; }
  .btn-sns:hover { border-color: #ffb3c8; }
  .btn-sns { margin-bottom: 10px; }
  .sns-label { font-size: 15px; color: var(--sub); margin: 0 4px 6px; }
  .sns-members { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 22px; }
  .sns-members a { display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 6px 10px;
                   background: #fff; border: 2px solid var(--line2); border-radius: 999px; color: var(--text);
                   font-size: 16px; text-decoration: none; }
  .sns-members a::before { content: "📷"; margin-right: 6px; font-size: 14px; }
  .sns-members a:hover { border-color: #ffb3c8; }
  /* ボタンはみんな同じ大きさ。1つ余ったら、まん中に置く */
  .sns-members { display: flex; flex-wrap: wrap; justify-content: center; }
  .sns-members a { flex: 0 0 calc(50% - 4px); }
  .sns-members.x a::before { content: "📣"; }
  /* 新着の「YouTube／ニュース」切りかえ（2026年11月14日 案B） */
  .tabs { display: flex; gap: 8px; margin: 0 0 10px; }
  .tab { flex: 1; min-height: 48px; border-radius: 999px; border: 2px solid var(--line); background: #fff;
         font-family: inherit; font-size: 17px; color: var(--sub); }
  .tab.on { background: #ffc2d4; border-color: #ffc2d4; color: #3d2e2e; }
  .tag.src { background: #fff3d6; color: #7a4d00; white-space: nowrap; max-width: 9em; overflow: hidden; text-overflow: ellipsis; }
  .item.news .meta { white-space: nowrap; }
  .when { white-space: nowrap; }
  .more2 { white-space: nowrap; margin-left: auto; font-size: 13px; color: var(--sub); background: #f6eeee; border-radius: 999px; padding: 0 8px; }
  .item.news .dot + .meta .more2 { margin-right: 14px; }
  /* タブは2だん（2つずつ）（2026年11月14日 みんさんが決定） */
  /* 新着のタブは4つ横1列。絵が上、名前が下（2026年11月14日 見本B） */
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .tabs .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; min-height: 58px;
               border-radius: 18px; padding: 2px; font-size: 13px; line-height: 1.2; white-space: nowrap; }
  .tabs .tab .ic { font-size: 20px; }
  /* 出演情報：出てくるメンバーの色の丸 */
  .mem { margin-left: auto; display: inline-flex; gap: 3px; flex: none; }
  .mem i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.08); }
  .more2 + .mem { margin-left: 6px; }
  .item.news .dot ~ .meta .mem { margin-right: 14px; }
  /* ライブ情報（公式のお知らせはピンクのカード） */
  .tag.official { background: var(--pink); color: #fff; white-space: nowrap; }
  .item.official { background: #fff6f9; border-color: #ffc2d4; border-left: 7px solid #ffb3c9; }
  .btn-official { display: flex; align-items: center; justify-content: center; min-height: 48px; margin: 0 0 10px;
                  padding: 8px 14px; background: #fff; border: 2px solid var(--pink); border-radius: 999px;
                  color: var(--pink); font-size: 16px; text-decoration: none; }
  /* ===== 記事の種類分け ===== */
  .chips.cats { margin: 0 0 8px; }
  .chips.cats .chip { font-size: 14px; min-height: 36px; padding: 2px 10px; }
  .chips.cats .chip small { font-size: 11px; color: inherit; opacity: .7; }
  .cattag { white-space: nowrap; font-size: 11px; border-radius: 999px; padding: 0 7px; color: #fff; background: #b9a8a8; }
  .c-video { background: #e2577f; } .c-drama { background: #7a4dbf; } .c-live { background: #c7406a; } .c-radio { background: #23794f; }
  .c-magazine { background: #b85a12; } .c-music { background: #1f6fb2; } .c-tv { background: #2b6f9e; }
  .btn-official.tver { margin-top: -2px; border-color: #1f6fb2; color: #1f6fb2; }
  .btn-official.yt { border-color: #e03b3b; color: #e03b3b; }
  .news-box { position: relative; border-radius: 24px; border: 3px solid transparent; margin: 30px 0 22px; padding: 24px 8px 6px;
              background: linear-gradient(#fff, #fff) padding-box, linear-gradient(90deg, #ffb3c9, #ffe36e, #9fc3ff, #dfe6f1, #ff9494) border-box; }
  .news-box > h2 { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); margin: 0; padding: 2px 18px; white-space: nowrap;
                   background: #fff; border: 3px solid #ffc2d4; border-radius: 999px; font-size: 17px; }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn-row .btn-official { margin-top: -2px; padding: 6px 4px; font-size: 14px; white-space: nowrap; letter-spacing: -.02em; font-family: inherit; cursor: pointer; }
  .btn-official.vid { border-color: #e2577f; color: #e2577f; }
  .btn-row.two-line .btn-official { line-height: 1.25; min-height: 54px; text-align: center; }
  .btn-official.vid.on { background: #e2577f; color: #fff; }
  .more.back { margin: 0 0 10px; }
  /* 出演タブの、種類ごとに開け閉めできる箱 */
  .acc { border: 3px solid #ffc2d4; border-radius: 18px; background: #fff; margin: 0 0 8px; box-shadow: 0 2px 8px rgba(226,87,127,.10); }
  .acc summary { list-style: none; cursor: pointer; min-height: 46px; display: flex; align-items: center; gap: 8px; padding: 6px 14px; font-size: 16px; color: var(--pink); }
  .acc summary::-webkit-details-marker { display: none; }
  .acc summary small { color: var(--sub); font-size: 12px; }
  .acc summary::after { content: "▼"; margin-left: auto; font-size: 12px; transition: transform .2s; }
  .acc[open] summary::after { transform: rotate(180deg); }
  .acc .in { padding: 0 8px 4px; }
  @media (prefers-reduced-motion: reduce) { .acc summary::after { transition: none; } }
  .sect { display: flex; align-items: center; gap: 8px; font-size: 16px; color: var(--pink); margin: 14px 4px 6px; }
  .sect small { font-size: 12px; color: var(--sub); }
  .sect::after { content: ""; flex: 1; height: 2px; background: var(--line); border-radius: 2px; }
  .item.news .meta { flex-wrap: nowrap; overflow: hidden; }
  /* ===== よてい帳（2026年11月14日 追加） ===== */
  .kind { display: inline-block; border-radius: 999px; padding: 0 8px; font-size: 12px; margin-right: 5px; color: #fff; vertical-align: 1px; white-space: nowrap; }
  .k-yt { background: #d6366a; } .k-tv { background: #1f6fb2; } .k-dr { background: #7a4dbf; } .k-ra { background: #23794f; } .k-sns { background: #b85a12; } .k-live { background: #c2185b; } .k-art { background: #8a6d5a; }
  .today { background: #fff; border: 3px solid #ffb3c9; border-radius: 20px; padding: 10px 14px; margin: 14px 0 -2px; }
  .today .ev { text-decoration: none; color: inherit; }
  .today .ev.past { opacity: .6; }
  .today .ev2 .evmain { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; text-decoration: none; color: inherit; }
  .today .ev2 .gos { display: flex; gap: 5px; flex: 0 0 auto; }
  .today .ev2 .go { padding: 8px 10px; font-size: 14px; }
  .today .ev2 .go.gtv { background: #fff; border: 2px solid #1f6fb2; color: #1f6fb2; font-weight: bold; }
  .today .artnote { font-size: 11px; color: #a08888; text-align: center; margin: 4px 0 0; }
  .today.none { border-width: 2px; border-style: dashed; color: var(--sub); font-size: 15px; text-align: center; padding: 10px 12px; }
  .today.none small { display: block; font-size: 13px; color: var(--text); margin-top: 2px; }
  .today h3 { font-size: 17px; color: var(--pink); font-weight: normal; margin-bottom: 4px; }
  .today .ev { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 2px dashed var(--line2); }
  .today .tname + .ev { border-top: none; }
  .today .time { font-size: 22px; color: #3d2e2e; min-width: 58px; }
  .today .nm { flex: 1; font-size: 15px; line-height: 1.4; min-width: 0; }
  .left2 { display: block; font-size: 13px; color: var(--rose); } .left2.done { color: var(--sub); }
  .go { background: #ffc2d4; border-radius: 999px; padding: 8px 14px; font-size: 15px; color: #3d2e2e; text-decoration: none; white-space: nowrap; min-height: 44px; display: inline-flex; align-items: center; }
  .ev-form-box { background: #fff; border: 2px dashed #ffb3c9; border-radius: 18px; margin-bottom: 12px; }
  .ev-form-box summary { list-style: none; cursor: pointer; min-height: 48px; display: flex; align-items: center; justify-content: center; color: var(--pink); font-size: 17px; }
  .ev-form-box summary::-webkit-details-marker { display: none; }
  .ev-form-box form { border: none; margin: 0; padding: 0 14px 14px; }
  .ev-row { display: flex; gap: 10px; } .ev-row > div { flex: 1; min-width: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { font-family: inherit; font-size: 15px; min-height: 40px; padding: 4px 12px; border: 2px solid var(--line); border-radius: 999px; background: #fff; color: var(--sub); }
  .chip.on { background: #ffc2d4; border-color: #ffc2d4; color: #3d2e2e; }
  .evitem { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 10px; background: #fff; border: 2px solid var(--line2); border-radius: 18px; }
  .evitem .name { flex: 1; font-size: 16px; min-width: 0; word-break: break-all; line-height: 1.5; }
  .evitem .name a { color: inherit; }
  .evitem .date { display: block; font-size: 13px; color: var(--sub); }
  .evitem .actions { flex: none; }
  .cal { width: 56px; height: 56px; flex: none; border-radius: 14px; background: #fff6f9; border: 2px solid #ffc2d4; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
  .cal b { font-weight: normal; font-size: 22px; color: var(--pink); } .cal small { font-size: 11px; color: var(--sub); }
  .rep { font-size: 11px; background: #e6f6ee; color: var(--green); border-radius: 999px; padding: 0 7px; margin-left: 4px; white-space: nowrap; }
  .rep.auto { background: #e6f4ff; color: var(--blue); }
  .mem.inline { margin-left: 6px; display: inline-flex; vertical-align: middle; }
  .cand { background: #fff6d6; border: 2px solid #ffe08a; border-radius: 16px; padding: 10px 12px; margin-bottom: 10px; font-size: 14px; line-height: 1.6; }
  .cand b { font-weight: normal; color: #7a4d00; } .cand .ct, .cand .cw { display: block; }
  .btn-cand { margin-top: 6px; font-family: inherit; font-size: 15px; min-height: 44px; background: #fff; border: 2px solid #e8c25a; border-radius: 999px; padding: 4px 14px; color: #7a4d00; }

const DROP_COLORS = ["#ffb3c9", "#ffe36e", "#9fc3ff", "#e6ecf5", "#ff9494"];
function meltTopPath(width, base = 24, f = 14, amp = 6) {
  // 右によせた5本のしずく（大きさはどの画面でも同じ）
  const drips = [[width - 186, 22, 40], [width - 138, 20, 28], [width - 94, 26, 56], [width - 52, 22, 38], [width - 12, 24, 64]];
  let d = `M0 -40 H${width} V${base} `, cur = width, up = true;
  for (const [x, w, dep] of [...drips].sort((a, b) => b[0] - a[0])) {
    const r = w / 2, neck = w * 0.42, xr = x + r, xl = x - r, sx = x + neck + f;
    const mid = (cur + sx) / 2, yy = base + (up ? amp : -amp * 0.6); up = !up;
    d += `C${cur - (cur - mid) * 0.5} ${base} ${mid + (cur - mid) * 0.4} ${yy} ${mid} ${yy} C${mid - (mid - sx) * 0.4} ${yy} ${sx + (mid - sx) * 0.5} ${base} ${sx} ${base} `;
    d += `C${x + neck + f * 0.3} ${base} ${x + neck} ${base + f * 0.4} ${x + neck} ${base + f} C${x + neck} ${base + dep * 0.55} ${xr} ${base + dep - r * 1.7} ${xr} ${base + dep - r} `;
    d += `A${r} ${r} 0 0 1 ${xl} ${base + dep - r} C${xl} ${base + dep - r * 1.7} ${x - neck} ${base + dep * 0.55} ${x - neck} ${base + f} C${x - neck} ${base + f * 0.4} ${x - neck - f * 0.3} ${base} ${x - neck - f} ${base} `;
    cur = x - neck - f;
  }
  const n = Math.max(1, Math.floor(cur / 90)), seg = cur / n;   // 左がわは、ゆるい波
  for (let i = 0; i < n; i++) {
    const a = cur - seg * i, b = cur - seg * (i + 1), yy = base + (i % 2 === 0 ? amp : -amp * 0.5);
    d += `C${a - seg * 0.3} ${base} ${b + seg * 0.6} ${yy} ${(a + b) / 2} ${yy} C${b + seg * 0.3} ${yy} ${b + seg * 0.2} ${base} ${b} ${base} `;
  }
  const drops = drips.map(([x, w, dep], i) => `<ellipse cx="${x}" cy="${base + dep + 11}" rx="5.5" ry="7" fill="${DROP_COLORS[i]}" stroke="rgba(226,87,127,.2)"/>`).join("");
  return { d: d + "Z", drops };
}
function meltBottomPath(width, h = 120, level = 40, amp = 7) {
  // 下にたまったミルク。左がわに5人の色のしずくがぽちゃん
  const y0 = h - level, n = Math.max(2, Math.round(width / 60)), seg = width / n;
  let d = `M0 ${h + 40} V${y0} `;
  for (let i = 0; i < n; i++) {
    const a = seg * i, b = seg * (i + 1), yy = y0 + (i % 2 === 0 ? -amp : amp * 0.6);
    d += `C${a + seg * 0.3} ${y0} ${b - seg * 0.6} ${yy} ${(a + b) / 2} ${yy} C${b - seg * 0.3} ${yy} ${b - seg * 0.2} ${y0} ${b} ${y0} `;
  }
  const pos = [[30, 40], [62, 58], [96, 36], [130, 62], [164, 46]];
  const drops = pos.map(([x, y], i) => `<ellipse cx="${x}" cy="${y}" rx="5.5" ry="7" fill="${DROP_COLORS[i]}" stroke="rgba(226,87,127,.2)"/>`).join("");
  return { d: d + `V${h + 40} Z`, drops };
}

  $("meltTop").setAttribute("viewBox", `0 0 ${w} 124`);

// ===== 記事の種類分け（2026年11月14日）=====
// 📰ニュース：全部の記事を種類ごとの小さなタブで分ける ／ 🎤ライブ：公式のライブ・コンサート情報だけ ／ 📺出演：公式のお知らせをドラマ・バラエティなどに分ける
const VIDEO_RE = /インタビュー|予告|番宣|【動画】|動画あり|動画解禁|動画公開|映像|メイキング|メーキング|CM|ムービー|TVer|YouTube/;
const CATS = [
  ["video", "🎥 動画・インタビュー", VIDEO_RE],
  ["drama", "🎬 ドラマ", /ドラマ|主演|第\d+話|映画|朗読劇|舞台/],
  ["live", "🎤 コンサート", /ライブ|LIVE|ツアー|TOUR|公演|コンサート|フェス|FES|チケット|会場|ファンミ/i],
  ["radio", "📻 ラジオ", /ラジオ|ニッポン放送|オールナイトニッポン|文化放送|レコメン|FM|AM/],
  ["magazine", "📖 雑誌", /表紙|雑誌|号|グラビア|誌|インタビュー/],
  ["music", "🎵 音楽", /新曲|シングル|アルバム|ALBUM|MV|リリース|チャート|Billboard|楽曲|配信スタート|ストリーミング/],
  ["tv", "📺 テレビ", /番組|放送|バラエティ|紅白|歌番組|歌謡祭|Mステ|テレビ|特番|冠|出演|生出演|TVer/],
];
const CAT_OTHER = ["other", "💬 話題・写真"];
// 記事の種類。video=false のときは「動画・インタビュー」に分けない（出演のタブ用）
function catOf(title, source = "", video = true) {
  if (video && /^(TVer|YouTube)$/.test(source || "")) return "video";
  for (const [k, , re] of CATS) { if (k === "video" && !video) continue; if (re.test(title || "")) return k; }
  return "other";
}
const catOfItem = (n) => catOf(n.title, n.source);
function catLabel(k) { const c = CATS.find(x => x[0] === k); return c ? c[1] : CAT_OTHER[1]; }
function cleanKey(t) { return newsKey(String(t || "").replace(/^プレスリリース：/, "")); }
function groupArticles(list, exact = false) {   // 同じ話題の記事は1つにまとめて「ほか◯件」（exact：題名がまったく同じものだけ）
  const out = [], by = {};
  for (const n of [...list].sort((a, b) => (b.published || "").localeCompare(a.published || ""))) {
    const k = exact ? String(n.title || "").replace(/^プレスリリース：/, "") : cleanKey(n.title);
    if (by[k]) { by[k].more++; if (n.official) by[k].official = true; continue; }
    by[k] = { ...n, title: String(n.title || "").replace(/^プレスリリース：/, ""), more: 0, official: n.official || /オフィシャル/.test(n.source || "") };
    out.push(by[k]);
  }
  return out;
}
function articleCard(n, opts = {}) {
  const t = new Date(n.published || "");
  const day = isNaN(t) ? "" : `${t.getMonth() + 1}月${t.getDate()}日`;
  const isNew = prevSeen && n.found_at && n.found_at > prevSeen;
  const badge = n.official ? `<span class="tag official">⭐ 公式</span>` : `<span class="tag src">${esc(n.source || "ニュース")}</span>`;
  const cat = opts.showCat ? `<span class="cattag c-${catOfItem(n)}">${catLabel(catOfItem(n))}</span>` : "";
  return `<a class="item news ${n.official ? "official" : ""}" href="${esc(safeUrl(n.url))}" target="_blank" rel="noopener">
      ${isNew ? `<span class="dot" title="まだ見ていない最新"></span>` : ""}
      <div class="meta">${badge}<span class="when">${esc(day)}</span>${cat}${n.more ? `<span class="more2">ほか ${n.more} 件</span>` : ""}${opts.dots ? memberDots(n.title) : ""}</div>
      <div class="ttl">${esc(n.title)}</div>
    </a>`;
}
let newsCat = "all";
try { newsCat = localStorage.getItem("mp_newscat") || "all"; } catch (e) {}
let showAllCat = false;
function renderNewsCats(s) {
  const all = groupArticles([...(s.news || []), ...(s.appear || []), ...(s.live || []), ...(s.video || [])]);
  const counts = {};
  for (const n of all) { const k = catOfItem(n); counts[k] = (counts[k] || 0) + 1; }
  const chips = [["all", "すべて"], ...CATS.map(c => [c[0], c[1]]), CAT_OTHER]
    .filter(([k]) => k === "all" || counts[k])
    .map(([k, l]) => `<button type="button" class="chip ${newsCat === k ? "on" : ""}" data-cat="${k}">${l}${k === "all" ? "" : ` <small>${counts[k]}</small>`}</button>`).join("");
  const list = newsCat === "all" ? all : all.filter(n => catOfItem(n) === newsCat);
  const shown = showAllCat ? list : list.slice(0, SHOW_N);
  let lastLabel = "";
  const body = shown.map(n => {
    const t = new Date(n.published || ""); const label = dayLabel(isNaN(t) ? "" : ymd(t));
    const head = label !== lastLabel ? `<p class="day">${label}</p>` : ""; lastLabel = label;
    return head + articleCard(n, { showCat: newsCat === "all" });

  $("items").innerHTML = `<div class="chips cats">${chips}</div>`
    + (list.length === 0 ? `<div class="empty">📰 この種類の記事は、まだないよ</div>` : body)
    + (list.length > SHOW_N && !showAllCat ? `<button class="more" id="btnMore">もっと見る（あと ${list.length - SHOW_N} 件）</button>` : "");
  document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => {
    newsCat = b.dataset.cat; showAllCat = false;
    try { localStorage.setItem("mp_newscat", newsCat); } catch (e) {}

  const more = $("btnMore");
  if (more) more.onclick = () => { showAllCat = true; render(); };

}

function toDate(s) { return new Date((s || "") + ":00"); }   // "2026-11-20T23:00" → 日時
// 🤝 イベント情報（2026年11月15日 見本A → 11月16日「今月のイベント」に変更）
//   公式のお知らせ（コンサート・出演・予定さがし）とニュースから、イベントの記事を自動で集めて「今月」の分だけ出す。
//   題名に日付（11月20日・11/20 など）があれば、その月が今月のものだけ。日付がなければ、今月に出たお知らせだけ。
const MEET_RE = /お見送り|ハイタッチ|握手|お渡し|サイン会|ファンミ|ファンミーティング|感謝祭|リリイベ|リリースイベント|番組イベント|観覧|抽選会|ラッキードロー|トークショー|イベント|公演|ツアー|TOUR|コンサート|CONCERT|フェス|FES(?![a-z])|FESTIVAL|歌謡祭|音楽祭|ライブ|LIVE/;
const MEET_NG = /映像|Blu-ray|DVD|グッズ|生写真|Tシャツ|レポート|回想|振り返|インタビュー|発売|放送決定|配信決定|MV|PV/;
function meetTag(t) {
  const m = t.match(/お見送り会|ハイタッチ会|握手会|お渡し会|サイン会|ファンミーティング|感謝祭|リリースイベント|番組イベント|観覧|抽選会|ラッキードロー|トークショー|歌謡祭|音楽祭|フェス|FES|公演|ツアー|TOUR|コンサート|ライブ/);
  if (!m) return "イベント";
  const w = m[0].toUpperCase();
  return w === "TOUR" || w === "ツアー" || w === "公演" ? "コンサート" : w === "FES" ? "フェス" : m[0];
}
function titleMonths(t) {   // 題名の中の日付の「月」をぜんぶ取り出す（11月20日 → 11、【10/24(土) → 10）
  const ms = [];
  for (const m of String(t || "").matchAll(/(\d{1,2})月\s*\d{1,2}日|(?<![\d/])(\d{1,2})\/(\d{1,2})(?![\d\/])/g)) {
    const mo = +(m[1] || m[2]);
    if (mo >= 1 && mo <= 12) ms.push(mo);
  }
  return ms;
}
function titleDayLabel(t, mo) {   // 今月の日付を1つ取り出して「11月20日」の形に
  const m = String(t || "").match(new RegExp(`(?:^|[^\\d])${mo}月\\s*(\\d{1,2})日|(?:^|[^\\d/])${mo}\\/(\\d{1,2})(?![\\d/])`));
  return m ? `${mo}月${m[1] || m[2]}日` : "";
}
function renderMeet(s) {
  const now = new Date(), mo = now.getMonth() + 1, ym = `${now.getFullYear()}-${String(mo).padStart(2, "0")}`;
  const all = [...(s.official || []), ...(s.live || []), ...(s.appear || []), ...(s.sched || []), ...(s.news || [])]
    .filter(n => {
      const t = n.title || "";
      if (!/M!LK|M！LK|佐野|吉田|山中|曽野|塩[崎﨑]/.test(t + (n.source || ""))) return false;
      if (!MEET_RE.test(t) || MEET_NG.test(t)) return false;
      const ms = titleMonths(t);
      const pub = (n.published || "").slice(0, 7);
      if (ms.length) return ms.includes(mo) && pub >= `${now.getFullYear() - (mo <= 2 ? 1 : 0)}-01`;   // 日付あり：今月の日付が入っている（古すぎるお知らせは外す）
      return pub === ym;                                     // 日付なし：今月に出たお知らせ
    })
    .map(n => ({ ...n, official: n.official || /オフィシャル/.test(n.source || "") }));
  const list = groupArticles(all).sort((a, b) => (b.official - a.official) || (b.published || "").localeCompare(a.published || "")).slice(0, 5);
  const rows = list.map(n => {
    const t = new Date(n.published || "");
    const when = titleDayLabel(n.title, mo);
    const day = when ? `📅 ${when}` : (isNaN(t) ? "" : `${t.getMonth() + 1}月${t.getDate()}日のお知らせ`);
    const src = n.official ? "⭐ 公式" : esc(n.source || "ニュース");
    return `<a class="row" href="${esc(safeUrl(n.url))}" target="_blank" rel="noopener"><span class="tag2">${esc(meetTag(n.title))}</span><div><div class="t">${esc(n.title)}</div><div class="d">${esc(day)}　${src}</div></div></a>`;
  }).join("");

}
// 📢 本日：記事からも「きょう」の放送・配信・イベントを自動でさがす（2026年11月16日）
//   今月出た公式のお知らせ・ニュースの題名に、きょうの日付（11月16日・11/16）があるもの。
//   または、きょう出た記事で「今夜」「本日」「このあと」などと書いてあるもの。
function todayFromArticles(s, evs) {
  const now = new Date(), mo = now.getMonth() + 1, dd = now.getDate(), today = ymd(now);
  const lim = new Date(now.getTime() - 45 * 86400000).toISOString().slice(0, 10);
  const dateRe = new RegExp(`(?:^|[^\\d])${mo}月\\s*${dd}日|(?:^|[^\\d/])${mo}\\/${dd}(?![\\d/])`);
  const doRe = /放送|配信|出演|オンエア|生放送|ドラマ|ラジオ|番組|公演|開催|イベント|歌謡祭|音楽祭|フェス|ライブ/;
  const ngRe = /発売|グッズ|生写真|レポート|回想|インタビュー|(放送|配信)(終了|された)|見逃し/;
  const list = [...(s.official || []), ...(s.sched || []), ...(s.appear || []), ...(s.live || []), ...(s.news || [])].filter(n => {
    const t = n.title || "", pub = (n.published || "").slice(0, 10);
    if (!/M!LK|M！LK|佐野|吉田|山中|曽野|塩[崎﨑]/.test(t + (n.source || ""))) return false;
    if (!doRe.test(t) || ngRe.test(t) || pub < lim) return false;
    if (dateRe.test(t)) return true;
    return pub === today && /今夜|今日|本日|このあと|この後|まもなく|今晩/.test(t);
  }).map(n => ({ ...n, official: n.official || /オフィシャル/.test(n.source || "") }));
  return groupArticles(list).filter(n => !evs.some(e => (e.url && e.url === n.url) || (n.title || "").includes((e.name || "").replace(/[（(].*$/, "").slice(0, 8))))
    .map(n => {
      const t = n.title, i = t.search(dateRe);
      const m = t.slice(Math.max(0, i)).match(/(\d{1,2})(?:時|:)(\d{2})?/);
      const hh = m ? +m[1] : null;
      return { ...n, time: hh != null && hh < 30 ? `${String(hh).padStart(2, "0")}:${m[2] || "00"}` : "" };
    })
    .sort((a, b) => (a.time || "99").localeCompare(b.time || "99")).slice(0, 4);
}

      if (e.kind === "tv" || e.kind === "drama") {   // テレビ・ドラマは「▶ 見る」の横に「TVer」も（2026年11月16日）

        </div>`;
      }).join("");
  document.querySelectorAll("[data-ev]").forEach(b => b.onclick = async () => {
    if (!confirm("この予定を消しますか？")) return;
    state = await api("/api/events/" + b.dataset.ev, { method: "DELETE" });
    render();
  });
  renderCandidates(s);
}
// 💡 記事から見つけた予定：題名に「11月20日(金)23時」のような日にちと時間があるもの
function renderCandidates(s) {
  const re = /(\d{1,2})月(\d{1,2})日[（(]?[月火水木金土日]?[)）]?\s*(\d{1,2})(?:時(\d{1,2})?分?|:(\d{2}))/;
  const now = new Date(), seen = new Set(), out = [];
  const have = new Set((s.events || []).map(e => e.date + " " + e.time));
  for (const n of [...(s.appear || []), ...(s.live || []), ...(s.news || [])]) {
    const m = re.exec(n.title || "");
    if (!m) continue;
    let y = now.getFullYear();
    const mo = +m[1], da = +m[2], hh = +m[3], mi = +(m[4] || m[5] || 0);
    if (mo < now.getMonth() + 1 - 1) y += 1;   // 1月に「12月…」は去年ではなく、来年の1月の話のことがある
    const date = `${y}-${pad(mo)}-${pad(da)}`, time = `${pad(hh)}:${pad(mi)}`;
    if (new Date(`${date}T${time}:00`) < now || have.has(date + " " + time)) continue;
    const k = date + " " + time;   // 同じ日にち・時間の予定は1つだけ出す
    if (seen.has(k)) continue;
    seen.add(k);
    const kind = /ドラマ/.test(n.title) ? "drama" : /ラジオ/.test(n.title) ? "radio" : /YouTube|配信/.test(n.title) ? "youtube" : "tv";
    const name = n.title.replace(/^プレスリリース：/, "").split(/[／/]/)[0].slice(0, 60);
    out.push({ name, date, time, kind, title: n.title });
  }
  $("cands").innerHTML = out.slice(0, 3).map((c, i) => `<div class="cand">💡 <b>記事から見つけた予定</b>
      <span class="ct">「${esc(c.title.replace(/^プレスリリース：/, "").slice(0, 70))}」</span>
      <span class="cw">${kindTag(c.kind)}${+c.date.slice(5, 7)}月${+c.date.slice(8)}日 ${c.time}</span>
      <button class="btn-cand" data-cand="${i}">＋ よてい帳に入れる</button></div>`).join("");
  document.querySelectorAll("[data-cand]").forEach(b => b.onclick = async () => {
    const c = out[+b.dataset.cand];
    try {
      state = await api("/api/events", { method: "POST", body: JSON.stringify({ name: c.name, date: c.date, time: c.time, kind: c.kind, repeat: "none", url: "", notify: ["eve", "30", "start"] }) });
      render();
    } catch (e) { alert(e.message); }
  });
}

const OFF_CATS = [["all", "すべて"], ["MEDIA", "📺 メディア"], ["LIVE", "🎤 ライブ・イベント"], ["GOODS", "🛍 グッズ"], ["RELEASE", "💿 リリース"], ["TICKET", "🎟 チケット"], ["FC", "💗 FC"]];

function offSorted(s) { return [...(s.official || [])].sort((a, b) => (b.published || "").localeCompare(a.published || "")); }
function renderOffTab(s) {

  const tod = list.filter(k => k.left === 0);
  $("party").innerHTML = tod.map(k => {
    const conf = (a, b, c, d) => `<span class="conf" style="left:10px;top:6px">${a}</span><span class="conf" style="right:12px;top:8px">${b}</span><span class="conf" style="left:16px;bottom:6px">${c}</span><span class="conf" style="right:16px;bottom:4px">${d}</span>`;
    if (k.kind === "milk") return `<div class="party">${conf("🎉", "✨", "🎈", "🥛")}<b>本日 M!LK 結成${k.n}周年！</b><small>${k.y}年${k.m}月${k.d}日の結成から${k.n}年<br>いつもありがとう💐</small></div>`;
    return `<div class="party" style="background:linear-gradient(120deg,${k.bg},#fffdf6,${k.bg});border-color:${k.col}">${conf("🎂", "✨", "🎈", "🎉")}<b>本日 ${esc(k.name)} さんの<br>${k.n}歳の誕生日！</b><small>${k.y}年${k.m}月${k.d}日生まれ<br>おめでとう🎉</small></div>`;
  }).join("");
}
function renderDeadlines(s) {
  renderEvents(s);
  renderMeet(s);
  renderKinen();
  renderOffBox(s);

  // アイデア2：大きな数字のカウントダウン（終わったものは下へ）
  const dls = [...s.deadlines].sort((a, b) => ((a.left ?? 0) < 0) - ((b.left ?? 0) < 0));
  $("dls").innerHTML = dls.length === 0
    ? `<div class="empty">📅 まだ締め切りはないよ。<br>上の欄から入れてみてね</div>`
    : dls.map(d => {
        const u = safeUrl(d.url);
        const nm = u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(d.name)}</a>` : esc(d.name);
        return `<div class="dl ${d.left !== null && d.left < 0 ? "over" : ""}">
          ${countBadge(d.left)}
          <div class="name">${nm}<span class="date">${esc(mdw(d.date))}まで</span></div>
          <div class="actions"><button class="del" data-id="${esc(d.id)}">消す</button></div>
        </div>`;
      }).join("");
  // しめきり帳の「消す」だけ（よてい帳の「消す」は data-ev で別。2026年11月14日 直した）
  document.querySelectorAll(".del[data-id]").forEach(b => b.onclick = async () => {
    if (!confirm("この締め切りを消しますか？")) return;
    state = await api("/api/deadlines/" + b.dataset.id, { method: "DELETE" });
    render();
  });
}


// 🆕 新しく来た情報（2026年11月16日 追加）
//   画面は1分ごとに自動で新しくなる（パソコンのアプリは YouTube を3分ごと・ニュースを10分ごとに自動で見回る）。
//   そのとき新しく見つかったものを、「いま見回る！」のすぐ下の黄色い箱に出す（2026-11-17 いちばん上から移動）。押すと、そのページに飛ぶ。
let knownIds = null, freshList = [];
function allArrivals(st) {
  const out = [];
  (st.items || []).forEach(n => out.push({ ...n, fk: isShort(n) ? "📱 ショート" : "▶ YouTube" }));
  Object.entries(st.member_yt || {}).forEach(([ch, l]) => (l || []).forEach(n => out.push({ ...n, fk: (isShort(n) ? "📱 " : "▶ ") + ch })));
  (st.official || []).forEach(n => out.push({ ...n, fk: "🏠 公式サイト" }));
  (st.news || []).forEach(n => out.push({ ...n, fk: "📰 ニュース" }));
  [...(st.live || []), ...(st.appear || [])].forEach(n => out.push({ ...n, fk: n.official ? "⭐ 公式" : "📰 ニュース" }));
  return out.filter(n => n.id && n.url);
}
function takeArrivals(st) {   // 新しく来たものの数を返す
  const all = allArrivals(st);
  if (knownIds === null) { knownIds = new Set(all.map(n => n.id)); return 0; }
  const seenUrl = new Set(freshList.map(n => n.url));
  const nw = all.filter(n => !knownIds.has(n.id) && !seenUrl.has(n.url) && (seenUrl.add(n.url), true));
  nw.forEach(n => knownIds.add(n.id));
  if (nw.length) freshList = [...nw.sort((a, b) => (b.published || "").localeCompare(a.published || "")), ...freshList].slice(0, 8);
  renderFresh();
  return nw.length;
}
function renderFresh() {
  if (!freshList.length) { $("fresh").innerHTML = ""; return; }
  $("fresh").innerHTML = `<section class="fresh"><div class="fh"><span>🆕 新しい情報が来たよ（${freshList.length}件）</span><button id="btnFreshClose">とじる</button></div>${freshList.map(n =>
    `<a href="${esc(safeUrl(n.url))}" target="_blank" rel="noopener"><span class="fk">${esc(n.fk)}</span><span>${esc(n.title)}</span><span class="go2">見る ›</span></a>`).join("")}</section>`;
  $("btnFreshClose").onclick = () => { freshList = []; renderFresh(); };
}

async function refresh() {
  try { state = await api("/api/state"); render(); takeArrivals(state); }
  catch (e) { $("err").innerHTML = `<div class="err">M!LKポストとつながりません。「milkポスト起動」をダブルクリックしてください。</div>`; }
}

$("tabYt").onclick = () => setTab("yt");
$("tabOff").onclick = () => setTab("off");
$("tabNews").onclick = () => setTab("news");
$("tabLive").onclick = () => setTab("live");
$("tabAppear").onclick = () => setTab("appear");
$("tabX").onclick = () => setTab("x");
$("tabIg").onclick = () => setTab("ig");

$("btnCheck").onclick = async () => {
  const b = $("btnCheck");
  b.disabled = true; b.innerHTML = `<span class="milk">🥛</span> 見回り中…<small class="sub">YouTube・ニュースを見に行っているよ</small>`;
  let msg = "";
  try {
    state = await api("/api/check", { method: "POST" }); render();
    const n = takeArrivals(state);
    msg = n ? `🆕 新しい情報が ${n} 件見つかったよ（すぐ下に出ています）` : `新しいものはなかったよ（${esc((state.last_check || "").slice(11, 16))} に見回り）`;

  }
  catch (e) { $("err").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  $("checkMsg").innerHTML = msg;
  b.disabled = false; b.innerHTML = `<span class="milk">🥛</span> いま見回る！<small class="sub">YouTube・ニュースの最新を今すぐチェック</small>`;
};

// よてい帳の入力：えらぶボタン（1つだけ／いくつでも）
document.querySelectorAll("#evForm .chips").forEach(box => box.querySelectorAll(".chip").forEach(b => b.onclick = () => {
  if (box.classList.contains("multi")) b.classList.toggle("on");
  else { box.querySelectorAll(".chip").forEach(x => x.classList.remove("on")); b.classList.add("on"); }
}));
$("eDate").value = ymd(new Date());
$("evForm").onsubmit = async (ev) => {
  ev.preventDefault();
  $("evMsg").textContent = "";
  const pick = (id) => [...document.querySelectorAll(`#${id} .chip.on`)].map(b => b.dataset.v);
  const body = { name: $("eName").value, date: $("eDate").value, time: $("eTime").value,
                 kind: pick("eKind")[0] || "tv", repeat: pick("eRepeat")[0] || "none", notify: pick("eNotify"), url: $("eUrl").value };
  if (!body.name.trim()) { $("evMsg").textContent = "なにを見るかを入れてください"; return; }
  if (!body.date || !body.time) { $("evMsg").textContent = "日にちと時間を入れてください"; return; }
  try {
    state = await api("/api/events", { method: "POST", body: JSON.stringify(body) });
    $("eName").value = ""; $("eUrl").value = "";
    $("evBox").open = false;
    render();
  } catch (e) { $("evMsg").textContent = e.message; }
};

$("form").onsubmit = async (ev) => {
  ev.preventDefault();
  $("formMsg").textContent = "";
  const body = { name: $("fName").value, date: $("fDate").value, url: $("fUrl").value };
  if (!body.name.trim()) { $("formMsg").textContent = "なにの締め切りかを入れてください"; return; }
  if (!body.date) { $("formMsg").textContent = "締め切りの日を入れてください"; return; }
  try {
    state = await api("/api/deadlines", { method: "POST", body: JSON.stringify(body) });
    $("form").reset(); render();
  } catch (e) { $("formMsg").textContent = e.message; }
};

$("btnTest").onclick = async () => {
  try {
    const r = await api("/api/test-notify", { method: "POST" });
    state = r; render();
    $("testMsg").textContent = r.test_ok === true ? "送りました。スマホの ntfy を見てください。"
      : r.dry_run ? "ためし運転中なので、送ったことにして記録だけしました。"
      : "送れませんでした。インターネットにつながっているか確かめてください。";
  } catch (e) { $("testMsg").textContent = e.message; }
};

if (location.protocol === "file:") {
  $("main").innerHTML = `<div class="warn">このファイルを直接開いても動きません。<br>
    同じフォルダの「<b>milkポスト起動</b>」をダブルクリックしてください。自動でこの画面が開きます。</div>`;
} else {
  refresh();
  setInterval(refresh, 60 * 1000); // 1分ごとに画面を新しくする
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });   // 画面にもどってきたら、すぐ新しくする
}
