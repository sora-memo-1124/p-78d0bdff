name: ページを自動で新しくする
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: 見回りをしてページを作る
        run: python3 build.py
      - name: 作ったページを記録する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html state.json
          git diff --cached --quiet || (git commit -m "ページを新しくした" && git push)
      - name: 公開する準備
        run: |
          mkdir -p _site
          cp index.html _site/
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
